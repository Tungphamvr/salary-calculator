<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take-home pay calculator</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1d2b26;--muted:#5f6f68;--line:#d5ddd8;--accent:#1f6f54;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b18;--card:#1c2622;--ink:#e8efeb;--muted:#9bada5;--line:#2f3d37;--accent:#52c29a;--accent-ink:#0e1a15}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:520px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0}
.lang button{font:inherit;font-size:.9rem;padding:6px 12px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
label{display:block;font-weight:600;margin:0 0 6px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-bottom:16px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.A{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:var(--muted)}
.A b{color:var(--ink)}
.result{margin-top:4px;padding:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.result small{display:block;opacity:.85}
.result strong{font-size:2rem;line-height:1.2}
.why{margin:12px 0 0;color:var(--muted);font-size:.95rem}
h2{font-size:1.05rem;margin:28px 0 8px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="vi" aria-pressed="false">VI</button>
    </div>
  </header>

  <div class="card">
    <label for="debt" data-i18n="debt"></label>
    <input id="debt" type="number" min="0" step="0.01" inputmode="decimal" value="0">

    <label for="income" data-i18n="income"></label>
    <input id="income" type="number" min="0" step="0.01" inputmode="decimal" value="0">

    <div class="A"><span data-i18n="aLabel"></span><b id="a">$0.00</b></div>
    <div class="A"><span data-i18n="pLabel"></span><b id="p">$0.00</b></div>

    <div class="result" aria-live="polite">
      <small data-i18n="result"></small>
      <strong id="out">$0.00</strong>
    </div>
    <p class="why" id="why"></p>
  </div>

  <h2 data-i18n="rules"></h2>
  <table>
    <tr><th data-i18n="cond"></th><th data-i18n="pay"></th></tr>
    <tr><td data-i18n="r1c"></td><td data-i18n="r1p"></td></tr>
    <tr><td data-i18n="r2c"></td><td data-i18n="r2p"></td></tr>
    <tr><td data-i18n="r3c"></td><td data-i18n="r3p"></td></tr>
  </table>
</main>

<script>
const T = {
  en: {
    pageTitle: "Take-home pay calculator",
    title: "Take-home pay calculator",
    sub: "Enter August's debt and September's take-home pay to see this month's payout.",
    debt: "August debt ($)",
    income: "September take-home pay ($)",
    aLabel: "A = August debt + September take-home",
    pLabel: "20% of A",
    result: "This month's payout",
    rules: "Rules",
    cond: "Condition", pay: "Payout",
    r1c: "A ≤ $500", r1p: "Pay all of A",
    r2c: "A > $500 and 20% of A < $500", r2p: "$500",
    r3c: "20% of A ≥ $500", r3p: "20% of A",
    why1: "A is $500 or less, so all of A is paid.",
    why2: "20% of A is under $500, so the $500 minimum is paid.",
    why3: "20% of A is $500 or more, so 20% of A is paid."
  },
  vi: {
    pageTitle: "Tính lương thực nhận tháng này",
    title: "Tính lương thực nhận tháng này",
    sub: "Nhập nợ tháng 8 và thực nhận tháng 9 để xem số tiền được trả.",
    debt: "Nợ tháng 8 ($)",
    income: "Thực nhận tháng 9 ($)",
    aLabel: "A = Nợ tháng 8 + Thực nhận tháng 9",
    pLabel: "20% của A",
    result: "Lương thực nhận tháng này",
    rules: "Quy tắc",
    cond: "Điều kiện", pay: "Trả",
    r1c: "A ≤ $500", r1p: "Trả hết A",
    r2c: "A > $500 và 20% A < $500", r2p: "$500",
    r3c: "20% A ≥ $500", r3p: "20% A",
    why1: "A không quá $500 nên trả hết A.",
    why2: "20% A dưới $500 nên trả mức tối thiểu $500.",
    why3: "20% A đạt từ $500 trở lên nên trả 20% A."
  }
};

const $ = id => document.getElementById(id);
const fmt = n => "$" + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});

let lang = "en";
try { const s = localStorage.getItem("lang"); if (s === "en" || s === "vi") lang = s; } catch (e) {}

function payout(A){
  if (A <= 500) return A;           // pay all of A
  return Math.max(500, 0.2 * A);    // at least $500, or 20% of A if larger
}

function update(){
  const debt = Math.max(0, parseFloat($("debt").value) || 0);
  const income = Math.max(0, parseFloat($("income").value) || 0);
  const A = debt + income, p = 0.2 * A;
  $("a").textContent = fmt(A);
  $("p").textContent = fmt(p);
  $("out").textContent = fmt(payout(A));
  $("why").textContent = T[lang][A <= 500 ? "why1" : p >= 500 ? "why3" : "why2"];
}

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.title = T[l].pageTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[l][el.dataset.i18n]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  try { localStorage.setItem("lang", l); } catch (e) {}
  update();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
$("debt").addEventListener("input", update);
$("income").addEventListener("input", update);
setLang(lang);
</script>
</body>
</html>
